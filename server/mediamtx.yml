# Local relay for Hubie: RTMP in on 127.0.0.1:1935, backup recording of the stream (kept 48 h).
logLevel: warn
api: no
metrics: no
pprof: no
playback: no
rtsp: no
rtmp: yes
rtmpAddress: 127.0.0.1:1935
hls: no
webrtc: no
srt: no

pathDefaults:
  record: no

paths:
  hubie:
    record: yes
    recordPath: /opt/hubie/recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordSegmentDuration: 1h
    recordDeleteAfter: 48h
